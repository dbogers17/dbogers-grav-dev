enabled: true

# Quark2 version this child theme's overridden files (see README.md's table)
# were last checked against. Bump this after processing a Quark2 update -
# it's how a future session knows whether the override table is still
# trustworthy or needs re-diffing against a newer Quark2 release.
quark2_synced_with_version: '1.1.7'

# Child theme of Quark2. Any template/CSS/image not found here falls back
# to user/themes/quark2, so a GPM update of quark2 can never overwrite
# anything in this folder, and this folder never needs its own copy of
# files we haven't actually changed.
streams:
  schemes:
    theme:
      type: ReadOnlyStream
      prefixes:
        '':
          - user/themes/quark2-custom
          - user/themes/quark2

# Same defaults as quark2, kept in sync manually - see quark2's own
# quark2.yaml if you want to compare after a quark2 update.
header-fixed: true
header-animated: true
header-transparent: false
sticky-footer: true
theme-mode: auto
accent-color: '#2563eb'
blog-page: '/blog'
fontawesome:
  enabled: true
  local: false
